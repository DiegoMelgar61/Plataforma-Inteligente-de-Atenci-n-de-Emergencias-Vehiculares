name: plataforma_emergencias
description: "Plataforma inteligente de atención de emergencias vehiculares - Cliente móvil"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0

  # HTTP Client
  dio: ^5.3.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Location & Maps
  geolocator: ^10.1.0

  # Media
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # WebSocket
  web_socket_channel: ^2.4.0

  # UI & Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0

  # Abrir URLs externas (Google Maps desde la pantalla de técnico)
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
