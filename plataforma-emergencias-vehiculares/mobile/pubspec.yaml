name: plataforma_emergencias
description: "Plataforma inteligente de atención de emergencias vehiculares - Cliente móvil"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # HTTP Client
  dio: ^5.3.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Location & Maps
  geolocator: ^10.1.0

  # Media
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  record: ^5.0.0

  # Permissions
  permission_handler: ^12.0.1

  # WebSocket
  web_socket_channel: ^2.4.0

  # UI & Utils
  fluttertoast: ^8.2.8
  intl: ^0.19.0
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.6

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    # No incluimos fonts por ahora porque los archivos no existen



